<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Save Data</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background:lightblue;
            font-family: Arial, sans-serif;

        }
        .container {
            width: 300px;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,.2);
        }
        h2 { text-align: center; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: red;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Form</h2>
        <input id="name" type="text" placeholder="Enter Name">
        <input id="mobile" type="text" placeholder="Enter Mobile Number">
        <button id="saveBtn" class="saveData">Save</button>
        <input id="photo" type="file" accept="image/*">
        <button id="button">
         <a href="mainhome page .html" style="text-decoration: none; color: inherit;">Next Page</a>
    </button>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const SUPABASE_URL = "https://gzitfihztwmvxsotihyl.supabase.co";
            const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6aXRmaWh6dHdtdnhzb3RpaHlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczOTExNzUsImV4cCI6MjEwMjk2NzE3NX0.2jZCMxCC3B-rAE-FeRujPIC5FRf_g2aaHWCVFyNQwBc";
            
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            document.getElementById("saveBtn").addEventListener("click", saveData);

            async function saveData() {
                const name = document.getElementById("name").value.trim();
                const mobile = document.getElementById("mobile").value.trim();
                const file = document.getElementById("photo").files[0];
                
                if (!file) { 
                    alert("⚠️ Photo select karein."); 
                    return; 
                }

                if (name === "" || mobile === "") {
                    alert("⚠️ Name aur Mobile Number bharo.");
                    return;
                }

                if (!/^[0-9]{10}$/.test(mobile)) {
                    alert("⚠️ Mobile Number 10 digit ka hona chahiye.");
                    return;
                }

                // Show visual feedback during save
                const btn = document.getElementById("saveBtn");
                btn.disabled = true;
                btn.innerText = "Saving........................";

                try {
                    // 1. Photo ka naam badalkar user ka Mobile Number (.jpg ke sath) rakhna
                    const fileExtension = file.name.split('.').pop() || 'jpg';
                    const fileName = `${mobile}.${fileExtension}`; 

                    // 2. Supabase Storage Bucket ("photos") me naye naam se image upload karna
                    const { data: storageData, error: storageError } = await supabase
                        .storage
                        .from("photos")
                        .upload(fileName, file, {
                            upsert: true // Pehle se photo hone par overwrite karega
                        });

                    if (storageError) {
                        alert("❌ Bucket Upload Fail: " + storageError.message);
                        return;
                    }

                    // 3. Uploaded photo ka naya Public Link (URL) nikalna
                    const { data: urlData } = supabase
                        .storage
                        .from("photos")
                        .getPublicUrl(fileName);

                    const photoUrl = urlData.publicUrl;

                    // 4. Database table 'try' me data save karna (Aapke naye 'url' column ke sath)
                    const { error } = await supabase
                        .from("try")
                        .insert([{ name, mobile, url: photoUrl }]);

                    if (error) {
                        console.error("Supabase Error:", error);
                        alert("❌ Data Save Nahi Hua! Error: " + error.message);
                    } else {
                        alert("✅ Data aur Nayi Photo Successfully Save Ho Gaya!");
                        document.getElementById("name").value = "";
                        document.getElementById("mobile").value = "";
                        document.getElementById("photo").value = ""; // Fixed: File selection successfully clear
                        document.getElementById("name").focus();
                    }

                } catch (err) {
                    console.error("Network Error:", err);
                    alert("❌ Connection Issue!");
                } finally {
                    btn.disabled = false;
                    btn.innerText = "Save";
                }
            }
        });
    </script>
</body>
</html>
